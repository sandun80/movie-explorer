services:
  movie-explorer:
    image: node:22-alpine
    container_name: movie-explorer-dev
    working_dir: /app

    ports:
      - "3000:3000"

    env_file:
      - .env.local

    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      

    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

    command: sh -c "npm install && npm run dev -- --webpack"

    restart: unless-stopped
